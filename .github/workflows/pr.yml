name: PR

on:
  pull_request:
  push:
    branches: [main]

# A push to a pull request makes the run for its previous commit worthless, so that run is
# cancelled rather than left to hold a runner for ten minutes. Runs on main are not: each
# one is the verdict on a commit that has landed, and a cancelled one is a missing verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Raised from 5 when the analyzer load smoke arrived: it downloads two pinned
    # compiler toolsets before it can run.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # version check compares against the newest release tag

      # Cheap text-only check, kept first so a version mistake fails before the build.
      # The release workflow writes package.json, so it trails the build version during
      # development - the invariants are that it never regresses below the newest
      # release, and that the build version is at or ahead of it.
      - name: Version sanity
        run: |
          set -euo pipefail
          package=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' package/package.json | head -1)
          build=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' src/Directory.Build.props | head -1)
          latest=$(git tag --list 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
          echo "package.json=$package  Directory.Build.props=$build  latest tag=${latest:-none}"

          lowest() { printf '%s\n%s\n' "$1" "$2" | sort -V | head -1; }

          # Stated as "not below" rather than "equal to" so the release commit, which
          # writes package.json and its tag in one push, cannot race this check.
          if [ -n "${latest:-}" ] && [ "$(lowest "$package" "$latest")" != "$latest" ]; then
            echo "::error::package.json version ($package) is below the newest release tag ($latest) - a released version must never regress."
            exit 1
          fi
          if [ "$(lowest "$build" "$package")" != "$package" ]; then
            echo "::error::Directory.Build.props version ($build) is behind package.json ($package)."
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # actions/cache rather than setup-dotnet's own cache, which keys on packages.lock.json
      # and this repository has none. Keyed on everything that decides what restore fetches:
      # the projects, the Roslyn and analyzer-testing versions pinned in Directory.Build.props,
      # and the SDK pin.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'src/Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # The two Unity compilers the smoke step below loads the analyzers into. Restored into
      # a directory of their own, which analyzer-load.sh keeps between runs; toolsets.proj
      # pins their exact versions, so it is the whole key.
      - name: Cache the pinned compiler toolsets
        uses: actions/cache@v4
        with:
          path: artifacts/smoke/packages
          key: smoke-toolsets-${{ runner.os }}-${{ hashFiles('.github/smoke/toolsets.proj') }}

      - name: Build
        run: dotnet build UnityPerformanceAnalyzers.sln -c Release

      - name: Test
        run: >
          dotnet test UnityPerformanceAnalyzers.sln -c Release --no-build
          --logger "console;verbosity=minimal"

      # Everything above compiles with the SDK's C# compiler, which is newer than the one
      # inside either supported Unity version. An analyzer built against a newer Roslyn
      # than its host cannot be created, and the host's answer is to warn once and then
      # compile as if no analyzer were passed: green build, shipped package, rules that
      # never run. This step is the only one that would notice, so it loads the built
      # analyzers into the pinned Unity compilers and asserts on what comes back.
      - name: Analyzer load smoke
        run: |
          set -euo pipefail
          bash .github/smoke/assert-selftest.sh
          bash .github/smoke/release-gate-selftest.sh
          bash .github/release/promote-analyzer-releases-selftest.sh
          bash .github/release/verify-cli-binary-selftest.sh
          bash .github/release/verify-cli-package-selftest.sh
          bash .github/smoke/analyzer-load.sh

      # The tool package is only ever built during a release, where a packaging mistake
      # would surface after the tag is already pushed and permanent. Packing here costs
      # seconds and moves that failure to the pull request. The install check is the same
      # script both release jobs run.
      - name: Pack the CLI tool
        run: |
          set -euo pipefail
          dotnet pack src/UnityPerformanceAnalyzers.Cli -c Release --no-build -o artifacts/nuget
          version=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' src/Directory.Build.props | head -1)
          bash .github/release/verify-cli-package.sh artifacts/nuget "$version"

      # Everything generated from the analyzers and PresetTable.cs, regenerated by the one
      # command CONTRIBUTING gives, then compared with what is committed: the presets, the
      # README rule tables (hand-maintained until v0.7, when v0.6.0 shipped claiming 41
      # rules against a package carrying 45), and the Rule Manager's rules.json.
      #
      # git status rather than git diff, which ignores untracked files: a generated file
      # nobody committed passed it, and so did one the generator had stopped producing.
      # The generator now deletes those, which only shows up as a status entry.
      - name: Generated files drift check
        run: |
          set -euo pipefail
          dotnet run --project src/UnityPerformanceAnalyzers.RuleManifest -c Release --no-build -- --all .
          generated=("package/Samples~/Ruleset Presets" sandbox/UnityProject/Assets/Default.ruleset
                     README.md README.zh-TW.md package/Editor/rules.json)
          drift=$(git status --porcelain -- "${generated[@]}")
          if [ -n "$drift" ]; then
            echo "::error::Generated files are out of date. Run 'dotnet run --project src/UnityPerformanceAnalyzers.RuleManifest -c Release -- --all .' and commit the result."
            printf '%s\n' "$drift"
            git diff -- "${generated[@]}" | head -200
            exit 1
          fi
