name: PR

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build UnityPerformanceAnalyzers.sln -c Release

      # Tests that need a real UnityEngine.dll are excluded on PR;
      # they run against the sandbox project in the release workflow instead.
      - name: Test
        run: >
          dotnet test UnityPerformanceAnalyzers.sln -c Release --no-build
          --filter "Category!=RequiresUnity"
          --logger "console;verbosity=minimal"

      # Preset files are generated from PresetTable.cs; a hand edit or a stale
      # regeneration shows up as a diff here and fails the build.
      - name: Preset drift check
        run: |
          dotnet run --project src/UnityPerformanceAnalyzers.RuleManifest -c Release --no-build -- --presets .
          git diff --exit-code -- "package/Samples~/Ruleset Presets" sandbox/UnityProject/Assets/Default.ruleset
