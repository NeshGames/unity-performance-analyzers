name: PR

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build UnityPerformanceAnalyzers.sln -c Release

      # Tests that need a real UnityEngine.dll are excluded on PR;
      # they run against the sandbox project in the release workflow instead.
      - name: Test
        run: >
          dotnet test UnityPerformanceAnalyzers.sln -c Release --no-build
          --filter "Category!=RequiresUnity"
          --logger "console;verbosity=minimal"
