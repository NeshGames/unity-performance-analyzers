name: Release

# Unity resolves the package straight out of the git tag the install URL names, so the tag
# itself must already contain the analyzer DLL and a package.json whose version matches it.
# Nothing can inject files into a tag that already exists, so releasing works the other
# way around: run this workflow manually and it creates the release commit, the tag, and
# the GitHub Release - in that order, and only after the package has been compiled in
# Unity.
# The version's single source is <Version> in src/Directory.Build.props; the
# package.json version is written here and must never be edited by hand.

on:
  workflow_dispatch:
    inputs:
      local_smoke:
        description: >
          Result of running .github/smoke/unity-load.sh outside CI, as
          "2022.3.62f2=pass 6000.5.3f1=pass" and nothing else. This is the normal path: the
          editor licence is deliberately not held by this repository, so the Unity layer
          runs on a developer machine. Every supported version must be stated as passing;
          anything else in the field, including pasted script output, is refused.
        required: false
        default: ""
      smoke_override:
        description: >
          Reason to release with no Unity result at all. Not for the case above - this one
          states that the package is untested against Unity, and says so on the release
          commit. It is refused when the smoke test ran and the package failed it.
        required: false
        default: ""
      preflight_only:
        description: >
          Only check that trusted publishing still works, then stop. Nothing is built,
          committed, tagged or published. Use it to prove a new or changed nuget.org
          policy before a release depends on it.
        type: boolean
        required: false
        default: false

# Deliberately no tags trigger. Publishing on any pushed v* tag was a way into the
# irreversible half of this workflow that skipped every gate in front of it: a tag whose
# version fields happen to line up would have had its CLI pushed to NuGet and a Release
# created, without the package ever having been compiled in Unity. Recovering a run that
# tagged and then failed is what the separate publish job is for - re-run it.

permissions:
  contents: write

# One release at a time. Two concurrent runs would each build a release commit on
# their own view of main, and the loser would fail after the winner had already
# published a permanent tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Answers "would a release be able to publish?" without releasing anything. The policy on
  # nuget.org is matched against the workflow file the token comes from, so this has to live
  # in this file to be worth running: a preflight in a workflow of its own would need a
  # second policy and would then prove that second policy works, which is not the question.
  #
  # It is the same exchange prepare-release performs, and the key is discarded the same way.
  # Nothing here checks out the repository, builds, or writes anything.
  credential-preflight:
    if: inputs.preflight_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: The nuget.org username is configured
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "${NUGET_USER:-}" ]; then
            echo "::error::NUGET_USER is not set. It is the nuget.org profile name that owns the trusted-publishing policy, not an email address."
            exit 1
          fi

      # Pinned to a commit rather than to the v1 tag, unlike the actions/* steps elsewhere
      # in this file. A moving tag decides later what code runs, and this is the one step
      # that holds id-token: write and turns it into a credential able to publish under our
      # name. The usual objection to pinning - silently running stale action code until a
      # release fails - is what this job answers: it is the cheap way to find that out, and
      # it finds it out before a release rather than during one.
      - name: Trusted publishing reaches nuget.org
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841   # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Report
        run: echo "Trusted publishing is configured correctly. Nothing was published." >> "$GITHUB_STEP_SUMMARY"

  # Pins the commit under test. Without it the smoke test and the release build would each
  # resolve "main" on their own, and a push landing between them would mean the thing that
  # was tested and the thing that ships are not the same commit - with nothing to notice.
  #
  # Skipping this on a preflight run is what stops the release: prepare-release requires a
  # successful snapshot, so the whole irreversible half collapses behind one condition
  # rather than each job having to remember to opt out.
  snapshot:
    if: ${{ !inputs.preflight_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.read.outputs.sha }}
      unity: ${{ steps.read.outputs.unity }}
      licence: ${{ steps.read.outputs.licence }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - id: read
        # Read here because a job-level `if` cannot see the secrets context, and the
        # question has to be answered before the matrix below is worth starting.
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          # Presence only; the value itself is never printed or written anywhere.
          if [ -n "${UNITY_LICENSE:-}" ]; then
            echo "licence=yes" >> "$GITHUB_OUTPUT"
          else
            echo "licence=no" >> "$GITHUB_OUTPUT"
            echo "No editor licence here, so the Unity layer runs outside CI - state its result in 'local_smoke'." >> "$GITHUB_STEP_SUMMARY"
          fi

          # One source for the Unity versions: the matrix below and the gate in
          # prepare-release both read this file, so a version can never be smoke-tested
          # without being required, or required without being tested.
          unity=$(jq -c . .github/smoke/unity-versions.json)
          test "$unity" != "[]"
          echo "unity=$unity" >> "$GITHUB_OUTPUT"
          echo "releasing $sha against Unity $unity"

  # Installs the package into a throwaway Unity project and compiles it, on every Unity
  # version the package claims to support. This is the only check that goes through
  # Unity's own import pipeline - the .meta labels, the package layout, the ruleset
  # lookup and the compiler arguments Unity assembles are all Unity's.
  #
  # It gates the tag rather than the publish step, because the tag *is* the Unity
  # distribution channel: UPM resolves the package straight out of it, so by the time a
  # tag exists a broken package is already installable.
  #
  # Skipped when this repository holds no editor licence, which is the deliberate state:
  # a .ulf is a credential bound to a Unity account, and any collaborator with write access
  # could read it back out of a workflow. Without it these jobs could only ever pull two
  # editor images to reach a foregone infra verdict, and the release gate would then need
  # an override every single time - which is how an override stops meaning anything. The
  # check itself is not given up: unity-load.sh takes the editor path as an argument, so it
  # runs on a developer machine and its result is stated in 'local_smoke'.
  unity-smoke:
    needs: snapshot
    if: needs.snapshot.outputs.licence == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false   # one version failing must not hide the other's verdict
      matrix:
        unity: ${{ fromJSON(needs.snapshot.outputs.unity) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.snapshot.outputs.sha }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The same two files a release places into the package. Unity must load the
      # assembled package, not a source tree.
      - name: Build and assemble the package
        run: |
          set -euo pipefail
          dotnet build UnityPerformanceAnalyzers.sln -c Release
          cp src/UnityPerformanceAnalyzers/bin/Release/netstandard2.0/UnityPerformanceAnalyzers.dll package/Analyzers/
          cp src/UnityPerformanceAnalyzers.CodeFixes/bin/Release/netstandard2.0/UnityPerformanceAnalyzers.CodeFixes.dll package/Analyzers/
          # The satellite travels next to the analyzer: the resource loader probes relative
          # to the assembly's own location, so a package without it reports in English on
          # the machines that would otherwise read Chinese.
          mkdir -p package/Analyzers/zh-Hant
          cp src/UnityPerformanceAnalyzers/bin/Release/netstandard2.0/zh-Hant/UnityPerformanceAnalyzers.resources.dll package/Analyzers/zh-Hant/

      # Records a verdict rather than just passing or failing, because the two ways this
      # can fail are not the same thing. "The package is wrong" must block the release.
      # "Unity never started" must not, on its own, be able to hold a release hostage for
      # reasons that have nothing to do with the product - but it must also never be
      # mistaken for a pass. unity-load.sh separates them by evidence: a product verdict
      # requires diagnostics from a real compile.
      - name: Compile the probe project in Unity
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_VERSION: ${{ matrix.unity }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/verdict"

          docker run --rm -e UNITY_LICENSE -e UNITY_VERSION \
            -v "$GITHUB_WORKSPACE":/repo -w /repo \
            "unityci/editor:ubuntu-$UNITY_VERSION-base-3" \
            bash -c '
              set -uo pipefail
              if [ -z "${UNITY_LICENSE:-}" ]; then
                echo "UNITY_LICENSE is not set; the editor cannot start." >&2
                exit 2
              fi
              mkdir -p /root/.local/share/unity3d/Unity
              printf "%s" "$UNITY_LICENSE" > /root/.local/share/unity3d/Unity/Unity_lic.ulf
              bash .github/smoke/unity-load.sh /opt/unity/Editor/Unity "$UNITY_VERSION"
            '
          status=$?

          case "$status" in
            0) verdict=pass ;;
            1) verdict=product ;;
            *) verdict=infra ;;   # anything else never reached a compile
          esac
          echo "$verdict" > "$RUNNER_TEMP/verdict/verdict.txt"
          echo "$UNITY_VERSION: $verdict (exit $status)" | tee -a "$GITHUB_STEP_SUMMARY"

          # The editor log travels in the same directory as the verdict, not as a second
          # upload path. Two paths with no common directory make the artifact root their
          # common ancestor instead, which would bury verdict.txt somewhere the gate does
          # not look - and a verdict the gate cannot find reads as one that never existed.
          cp artifacts/smoke/*.log "$RUNNER_TEMP/verdict/" 2>/dev/null || true

          # The step itself does not fail on a bad verdict: the verdict is the product,
          # and prepare-release is where it is acted on. A failed step here would
          # collapse both kinds of failure back into one.
          exit 0

      - name: Keep the verdict and the editor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-smoke-${{ matrix.unity }}
          path: ${{ runner.temp }}/verdict
          if-no-files-found: warn
          retention-days: 14

  prepare-release:
    needs: [snapshot, unity-smoke]
    # always(): a smoke job that never reported must still reach the gate below, which is
    # the only place allowed to decide what a missing verdict means.
    if: always() && needs.snapshot.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A job-level block replaces the workflow-level one outright rather than adding to it,
    # so contents must be restated here - this job pushes the release commit and the tag.
    permissions:
      contents: write
      id-token: write   # the OIDC token the trusted-publishing pre-flight below exchanges
    outputs:
      version: ${{ steps.version.outputs.version }}
      nuget: ${{ steps.version.outputs.nuget }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit the smoke test ran against, not whatever main points at now.
          ref: ${{ needs.snapshot.outputs.sha }}
          fetch-depth: 0

      # continue-on-error because the skipped-job case uploads nothing and the action treats
      # a pattern that matches no artifact as an error. A download that fails for any other
      # reason lands in the same place - no verdict files - and the gate reads that as "not
      # tested", which is the safe direction for a mistake to fall in.
      - name: Collect the Unity smoke verdicts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: unity-smoke-*
          path: ${{ runner.temp }}/verdicts

      # The decision itself lives in a script with its own self-test, which the pull
      # request workflow runs. It is the only thing standing between a package that failed
      # in Unity and a permanent tag, and both ways of getting it wrong are quiet ones.
      - name: The Unity smoke test allows this release
        env:
          LOCAL_VERDICT: ${{ inputs.local_smoke }}
          OVERRIDE: ${{ inputs.smoke_override }}
        run: |
          set -euo pipefail
          bash .github/smoke/release-gate.sh \
            "$RUNNER_TEMP/verdicts" .github/smoke/unity-versions.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version from Directory.Build.props
        id: version
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' src/Directory.Build.props)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

          # A NuGet id, a command name, and every version pushed under them are permanent,
          # so publishing waits for 1.0. Derived from the version rather than kept in a
          # flag someone has to remember to turn on: the release that is 1.0 is exactly the
          # release that should publish, and nothing has to be noticed for that to happen.
          #
          # Checked rather than assumed, because the shell reads a version it cannot parse
          # as "not 1.0 yet" and would carry on: past 1.0 that answer is wrong and silent.
          major=${VERSION%%.*}
          case "$major" in
            ''|*[!0-9]*)
              echo "::error::version '$VERSION' does not start with a number; it is the single source for the tag, the package and whether this release publishes."
              exit 1
              ;;
          esac

          # A prerelease of 1.0 does not publish. Claiming the id is the irreversible half
          # of going to 1.0, and an rc is precisely the release that is not sure yet.
          if [ "$major" -ge 1 ] && [ "${VERSION#*-}" = "$VERSION" ]; then nuget=yes; else nuget=no; fi
          echo "nuget=$nuget" >> "$GITHUB_OUTPUT"
          echo "publishes to NuGet: $nuget"

      # Versions are never recycled: a published tag is permanent.
      - name: Refuse to re-release an existing tag
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "::error::Tag v${{ steps.version.outputs.version }} already exists"; exit 1
          fi

      # Checked before anything is committed, tagged or pushed. Discovering a missing
      # credential after the tag exists would be unrecoverable: the tag is permanent and
      # the guard above rejects every rerun of that version. Skipping the push instead
      # would be worse than failing - the release notes tell users to install this exact
      # version from NuGet, and attaching the .nupkg does not make that command work.
      #
      # Publishing authenticates by OIDC, so there is no stored key whose presence could be
      # asserted. What can be wrong instead is the trusted-publishing policy on nuget.org:
      # absent, lapsed out of its provisional window, or naming a different owner, repo or
      # workflow file. None of that is visible from here, so the pre-flight performs the real
      # exchange and discards the key it gets. The policy is bound to the workflow file, and
      # the publish job below lives in this same file, so what succeeds here is what it will
      # present.
      # Both are skipped below 1.0, where the release publishes nothing: a credential this
      # run will never use is not a reason to refuse the run.
      - name: The nuget.org username is configured
        if: steps.version.outputs.nuget == 'yes'
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "${NUGET_USER:-}" ]; then
            echo "::error::NUGET_USER is not set. It is the nuget.org profile name that owns the trusted-publishing policy, not an email address. Add the secret and re-run - nothing has been pushed."
            exit 1
          fi

      # Held in a secret rather than written here because this workflow is part of the
      # published repository, and the account name is not something the package pages give away.
      - name: Trusted publishing reaches nuget.org
        if: steps.version.outputs.nuget == 'yes'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841   # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # Before the build, not after, so the build is what validates the file this release
      # will ship: the release-tracking analyzer reads both files as AdditionalFiles, and a
      # malformed section promoted afterwards would first be reported on somebody's next
      # build, with the tag already permanent.
      #
      # The decision itself lives in a script with its own self-test, which the pull request
      # workflow runs. This step runs once per release, in the half that cannot be undone.
      - name: Promote the unshipped analyzer release notes
        run: bash .github/release/promote-analyzer-releases.sh "${{ steps.version.outputs.version }}"

      - name: Build
        run: dotnet build UnityPerformanceAnalyzers.sln -c Release

      - name: Test
        run: >
          dotnet test UnityPerformanceAnalyzers.sln -c Release --no-build
          --filter "Category!=RequiresUnity"
          --logger "console;verbosity=minimal"

      - name: Sync package.json version
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' package/package.json > package/package.json.tmp
          mv package/package.json.tmp package/package.json

      # Both assemblies carry the RoslynAnalyzer label. Unity hands them to csc as
      # analyzers and the IDE picks up the code fixes from the same classification;
      # the unity-smoke job above compiles a project against exactly these two files on
      # every supported editor version.
      - name: Place analyzer DLLs into the package
        run: |
          cp src/UnityPerformanceAnalyzers/bin/Release/netstandard2.0/UnityPerformanceAnalyzers.dll package/Analyzers/
          cp src/UnityPerformanceAnalyzers.CodeFixes/bin/Release/netstandard2.0/UnityPerformanceAnalyzers.CodeFixes.dll package/Analyzers/
          # The satellite travels next to the analyzer: the resource loader probes relative
          # to the assembly's own location, so a package without it reports in English on
          # the machines that would otherwise read Chinese.
          mkdir -p package/Analyzers/zh-Hant
          cp src/UnityPerformanceAnalyzers/bin/Release/netstandard2.0/zh-Hant/UnityPerformanceAnalyzers.resources.dll package/Analyzers/zh-Hant/

      # The committed catalog may go stale during development; the released tag never does.
      - name: Regenerate the rule catalog for the Rule Manager window
        run: >
          dotnet run --project src/UnityPerformanceAnalyzers.RuleManifest -c Release --no-build
          -- package/Editor/rules.json

      # Install instructions must always point at the tag being cut; a moving tag or
      # #main would break UPM's revision locking, so the URL is versioned and synced here.
      - name: Point README install URLs at this release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NUGET: ${{ steps.version.outputs.nuget }}
        run: |
          set -euo pipefail
          sed -i -E "s|(\?path=/package#v)[0-9]+\.[0-9]+\.[0-9]+|\1$VERSION|g" README.md README.zh-TW.md
          # The CLI install command is pinned for the same reason as the UPM URL: an
          # unpinned command resolves the newest tool, which can know rules the package
          # this page pins does not, so the command line and the Editor would disagree.
          sed -i -E "s|(NeshGames\.UnityPerformanceAnalyzers\.Cli --version )[0-9]+\.[0-9]+\.[0-9]+|\1$VERSION|g" README.md README.zh-TW.md

          # The pages and the push have to agree in both directions. Telling people to
          # install from NuGet on a release that publishes nothing is the failure this
          # already produced once - the pages went out with the command months before any
          # package existed under that id. The reverse is just as bad and quieter: pushing
          # a package that no page mentions.
          for file in README.md README.zh-TW.md; do
            grep -q "path=/package#v$VERSION" "$file"

            if [ "$NUGET" = yes ]; then
              # The command as well as the id and version: the other direction forbids the
              # literal "dotnet tool install", so requiring less than that here would let
              # the page mention a package without ever saying how to get it.
              grep -q "dotnet tool install .*NeshGames.UnityPerformanceAnalyzers.Cli --version $VERSION" "$file" || {
                echo "::error::$file does not tell anyone how to install the CLI, and this release publishes it."; exit 1; }
              if grep -nE "NeshGames\.UnityPerformanceAnalyzers\.Cli( --global)?$" "$file"; then
                echo "::error::$file has an unpinned tool install command"; exit 1
              fi
            else
              if grep -n "dotnet tool install" "$file"; then
                echo "::error::$file tells people to install the CLI from NuGet, and this release publishes nothing there. Nothing has been pushed."; exit 1
              fi
            fi
          done

      # Packed before the tag so a packaging failure costs a re-run rather than stranding
      # a permanent tag. Publishing still happens after, since a NuGet version should not
      # exist without the tag it names.
      - name: Pack upa-cli
        run: |
          set -euo pipefail
          dotnet pack src/UnityPerformanceAnalyzers.Cli -c Release --no-build -o artifacts/nuget
          test -f "artifacts/nuget/NeshGames.UnityPerformanceAnalyzers.Cli.${{ steps.version.outputs.version }}.nupkg"

      # Proves the package installs and starts before the tag is cut; dotnet pack
      # succeeding says nothing about whether the tool runs.
      - name: The packed tool installs and runs
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          cd "$work"
          dotnet new tool-manifest
          dotnet tool install NeshGames.UnityPerformanceAnalyzers.Cli \
            --add-source "$GITHUB_WORKSPACE/artifacts/nuget" \
            --version "${{ steps.version.outputs.version }}"
          reported=$(dotnet upa-cli --version)
          if [ "$reported" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::packed tool reports $reported, expected ${{ steps.version.outputs.version }}"
            exit 1
          fi
          dotnet upa-cli --list-rules > /dev/null

      - name: Commit, tag, push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package/package.json package/Editor/rules.json README.md README.zh-TW.md
          # The promotion above is only real if it travels in the tag: the shipped file is
          # what a consumer reads to find out which version a rule arrived in.
          git add src/UnityPerformanceAnalyzers/AnalyzerReleases.Shipped.md
          git add src/UnityPerformanceAnalyzers/AnalyzerReleases.Unshipped.md
          git add -f package/Analyzers/UnityPerformanceAnalyzers.dll
          git add -f package/Analyzers/UnityPerformanceAnalyzers.CodeFixes.dll
          git add -f package/Analyzers/zh-Hant/UnityPerformanceAnalyzers.resources.dll

          # How a release was verified says so on the commit it tags. A job summary is gone
          # in a fortnight; whoever asks later why a version misbehaves reads the history.
          # The two notes are kept apart because they are different claims: one says the
          # Unity check was run elsewhere, the other says it was not run.
          message="Release v${{ steps.version.outputs.version }}"
          if [ -n "${LOCAL_SMOKE_NOTE:-}" ]; then
            message="$message

          Unity smoke test run outside CI: $LOCAL_SMOKE_NOTE"
          fi
          if [ -n "${SMOKE_OVERRIDE_NOTE:-}" ]; then
            message="$message

          Released without a Unity smoke result. Reason given: $SMOKE_OVERRIDE_NOTE"
          fi
          git commit -m "$message"
          git tag "v${{ steps.version.outputs.version }}"

          # main must not have moved since the snapshot: the release commit was built on
          # that commit and the Unity smoke test ran against it, so a fast-forward onto
          # newer history would publish a package nobody tested and nobody reviewed.
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD^)" ]; then
            echo "::error::main moved during the release run - re-run the workflow"; exit 1
          fi

          # --atomic or neither. Without it git updates each ref independently, so a
          # rejected branch update can still leave the tag published - and a tag is
          # permanent, which makes the failed run impossible to retry cleanly.
          # HEAD:refs/heads/main, not main: the checkout is of the snapshot commit, so
          # there is no local branch of that name to push.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v${{ steps.version.outputs.version }}"

  # A runnable binary per platform, so anything downstream can use the runner without a
  # checkout, a build, or a .NET install - a CI job downloads one archive and runs it.
  #
  # Built on the platform it targets rather than cross-published from one runner, because
  # the only check worth having here is that the binary actually starts and analyzes
  # something, and that check cannot be performed on a binary for another operating system.
  #
  # Reachable only after prepare-release, and it builds from the tag: an archive that does
  # not match the tag it hangs off is worse than no archive, because nothing about the
  # download says which commit it came from.
  cli-binaries:
    needs: prepare-release
    if: always() && needs.prepare-release.result == 'success'
    strategy:
      fail-fast: false   # one platform failing must not hide whether the others work
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare-release.outputs.version }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Self-contained, so the archive runs on a machine with no .NET installed - which is
      # the whole point of attaching it rather than pointing at the tool package.
      #
      # Deliberately not PublishSingleFile, and the reason belongs here because a smaller
      # download is the obvious thing for someone to try next: the runner resolves the
      # reference assemblies it compiles against through Assembly.Location, which a
      # single-file bundle defines as the empty string. The SDK refuses that outright
      # (IL3000) rather than shipping something that starts and then finds no references,
      # so this is a decision the build already enforces - not a preference.
      - name: Publish upa-cli for ${{ matrix.rid }}
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/UnityPerformanceAnalyzers.Cli -c Release \
            -r ${{ matrix.rid }} --self-contained true -o "publish/${{ matrix.rid }}"

      # Starting is not the same as working, and the difference is exactly the failure the
      # step above is shaped to avoid: a binary that resolves no reference assemblies still
      # prints its version happily and reports nothing on every file it is given. Only
      # analyzing real source tells the two apart.
      #
      # --all-warn because UPA0005 is off by default, and a probe that cannot fail proves
      # nothing. Exit 1 is the success case here: it means violations were found.
      # Starting is not the same as working, and the difference is exactly the failure the
      # step above is shaped to avoid: a binary that resolves no reference assemblies still
      # prints its version happily and reports nothing on every file it is given.
      #
      # The decision lives in a script with its own self-test, which the pull request workflow
      # runs. Inline, it ran under the runner's `bash -e` -- which `set -uo pipefail` does not
      # clear -- and upa-cli exiting 1 on the violations it was asked to find aborted the step
      # instead of passing it. That took out all three platforms on the 0.8.1 run.
      - name: The published binary analyzes a file
        shell: bash
        run: |
          exe="publish/${{ matrix.rid }}/upa-cli"
          [ -f "$exe.exe" ] && exe="$exe.exe" || true
          bash .github/release/verify-cli-binary.sh "$exe" "${{ needs.prepare-release.outputs.version }}"

      # Archived on the machine that built it, because the artifact upload does not carry
      # file modes: a Unix binary round-tripped through it loses its executable bit, and the
      # download then looks like a corrupt release rather than a packaging mistake.
      # The formats differ by platform for the same reason the binaries do - a .tar.gz is
      # what preserves the bit, and a .zip is what a Windows user can open.
      - name: Archive the binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/cli | Out-Null
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" `
            -DestinationPath "artifacts/cli/upa-cli-${{ needs.prepare-release.outputs.version }}-${{ matrix.rid }}.zip"

      - name: Archive the binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cli
          tar czf "artifacts/cli/upa-cli-${{ needs.prepare-release.outputs.version }}-${{ matrix.rid }}.tar.gz" \
            -C "publish/${{ matrix.rid }}" .

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.rid }}
          path: artifacts/cli
          if-no-files-found: error
          retention-days: 14

  # Publishing is its own job on purpose. The tag pushed above is permanent and the guard
  # in prepare-release rejects every rerun of that version, so a NuGet outage or a GitHub
  # API failure in the same job would strand the release with no way to finish it. Split
  # out, "Re-run failed jobs" repeats only this half, against the tag that already exists.
  # Everything here is idempotent for the same reason.
  publish:
    # Reachable only through prepare-release, which is reachable only through the smoke
    # gate. That chain is what makes "nothing is published that Unity has not compiled"
    # a property of the workflow rather than a habit.
    # cli-binaries is a dependency for ordering and artifacts only. It is deliberately not
    # allowed to hold up the half of this job that cannot be retried: always() below lets
    # the NuGet push proceed even when a platform build failed, and the assertion further
    # down is what refuses to create a release with a platform silently missing.
    needs: [prepare-release, cli-binaries]
    # always(), for the same reason prepare-release needs it and one step further along: a
    # skip travels down the whole needs graph, not just to the job that declared the
    # dependency. unity-smoke is skipped whenever no editor licence is held - the ordinary
    # state - and prepare-release stepped over that for itself while this job kept
    # inheriting it. v0.7.0 was tagged with no GitHub Release because of exactly this: the
    # tag is permanent and the guard above refuses to cut it again, so the half that was
    # skipped could not simply be run afterwards.
    if: always() && needs.prepare-release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # As above, restating contents is not redundant: this job creates the GitHub Release.
    permissions:
      contents: write
      id-token: write   # the OIDC token exchanged for the key that pushes to NuGet
    steps:
      - name: Resolve the tag
        id: tag
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The tag, not the branch: these artifacts must be the ones that tag ships.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Run here rather than as a sibling job, because publishing is irreversible: a NuGet
      # version cannot be withdrawn, so nothing may be pushed until the tag it names has been
      # shown to be internally consistent. As a parallel job these checks could still be
      # running while the package went out. Checked against the tag rather than the branch,
      # so what is asserted is what a consumer resolves.
      - name: The tag is internally consistent
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          package=$(jq -r '.version' package/package.json)
          catalog=$(jq -r '.version' package/Editor/rules.json)
          echo "tag=$VERSION package.json=$package rules.json=$catalog"

          test "$VERSION" = "$package"
          test "$VERSION" = "$catalog"
          test -f package/Analyzers/UnityPerformanceAnalyzers.dll
          test -f package/Analyzers/UnityPerformanceAnalyzers.CodeFixes.dll
          test -f package/Analyzers/zh-Hant/UnityPerformanceAnalyzers.resources.dll

      - name: Pack upa-cli from the tag
        run: |
          set -euo pipefail
          dotnet pack src/UnityPerformanceAnalyzers.Cli -c Release -o artifacts/nuget
          test -f "artifacts/nuget/NeshGames.UnityPerformanceAnalyzers.Cli.${{ steps.tag.outputs.version }}.nupkg"

      # Also present before the tag is cut, where it fails cheaply. It is repeated here
      # because this is the step that cannot be undone, and because that one packed the
      # working tree while this one packs the tag: dotnet pack succeeding says nothing
      # about whether the tool starts, and a NuGet version that does not start cannot be
      # withdrawn.
      - name: The packed tool installs and runs
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          cd "$work"
          dotnet new tool-manifest
          dotnet tool install NeshGames.UnityPerformanceAnalyzers.Cli \
            --add-source "$GITHUB_WORKSPACE/artifacts/nuget" \
            --version "$VERSION"
          reported=$(dotnet upa-cli --version)
          if [ "$reported" != "$VERSION" ]; then
            echo "::error::packed tool reports $reported, expected $VERSION"
            exit 1
          fi
          dotnet upa-cli --list-rules > /dev/null

      # continue-on-error for the same reason the smoke verdicts use it: a download that
      # fails leaves no files, and the step below reads that as "not built", which is the
      # direction a mistake should fall in. merge-multiple, so the three archives land in
      # one directory rather than one directory each.
      - name: Collect the CLI binaries
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: ${{ runner.temp }}/cli
          merge-multiple: true

      # Named one at a time rather than globbed into the asset list. A glob attaches
      # whatever happens to be present, so a platform whose build failed would produce a
      # release that merely has fewer downloads on it - and nothing anywhere would say
      # which platform is missing, or that one is.
      - name: Every platform's binary arrived
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            "upa-cli-$VERSION-linux-x64.tar.gz" \
            "upa-cli-$VERSION-osx-arm64.tar.gz" \
            "upa-cli-$VERSION-win-x64.zip"
          do
            if [ ! -f "$RUNNER_TEMP/cli/$name" ]; then
              echo "::error::$name is missing. Re-run the failed cli-binaries job and then re-run this one; the tag already exists and every step here is idempotent."
              missing=1
            fi
          done
          test "$missing" -eq 0

      # Ordered after the binary check on purpose. A NuGet version cannot be withdrawn, so
      # nothing may be pushed there while a release is still capable of failing. Before 1.0
      # this pushes nothing and the ordering is free; from 1.0 it is the difference between
      # a clean failure and a published package with no release to go with it.
      #
      # Everything above still runs before 1.0: packing and starting the tool are checks,
      # and a check that only happens on the release that publishes is a check that first
      # runs on the one occasion it must not fail. Only the push waits.
      #
      # Here rather than at the top of the job: the key nuget.org issues lasts an hour, and
      # the pack and install checks above are the slow part. Requesting it early would risk
      # spending that hour on the checks and reaching the push with an expired key.
      - name: NuGet login (OIDC to a short-lived key)
        id: login
        if: needs.prepare-release.outputs.nuget == 'yes'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841   # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish upa-cli to NuGet
        if: needs.prepare-release.outputs.nuget == 'yes'
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "::error::The login step returned no API key; the release notes advertise this version on NuGet. Re-run this job - the tag already exists and every step here is idempotent."
            exit 1
          fi
          dotnet nuget push "artifacts/nuget/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

      - name: Say that the CLI was not published
        if: needs.prepare-release.outputs.nuget != 'yes'
        run: |
          echo "The CLI was built, packed and started, but not pushed: a NuGet id and every version under it are permanent, so publishing begins at 1.0. The .nupkg and a ready-to-run binary for each platform are attached to the release." >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          NUGET: ${{ needs.prepare-release.outputs.nuget }}
        run: |
          set -euo pipefail
          notes=$(printf '%s\n' \
            "See package/CHANGELOG.md." \
            "" \
            "Unity package, via UPM:" \
            "https://github.com/$REPOSITORY.git?path=/package#$TAG")

          # The binaries first, under both branches. They need no .NET and no NuGet, which
          # is what makes them the answer for a CI job rather than a convenience -- and 0.8.2
          # went out with notes telling people to build from source in the line directly above
          # three ready-to-run archives.
          notes=$(printf '%s\n' "$notes" "" \
            "Command line runner - take the archive for your platform below." \
            "Self-contained: no .NET install, no clone, no build." \
            "  upa-cli-$VERSION-linux-x64.tar.gz" \
            "  upa-cli-$VERSION-osx-arm64.tar.gz" \
            "  upa-cli-$VERSION-win-x64.zip")

          # NuGet is named only where the push actually happened. An install command for a
          # package that was not pushed is the same defect the README once had.
          if [ "$NUGET" = yes ]; then
            notes=$(printf '%s\n' "$notes" "" \
              "Or install it as a dotnet tool:" \
              "dotnet tool install --global NeshGames.UnityPerformanceAnalyzers.Cli --version $VERSION")
          else
            notes=$(printf '%s\n' "$notes" "" \
              "The .nupkg is attached as well, but the tool is not on NuGet until 1.0 - an id" \
              "and every version under it are permanent.")
          fi

          # Taken from the package directory rather than a fresh build: those are the exact
          # bytes the tag ships to Unity, so an asset can never differ from what UPM resolves.
          # The binaries come from the platform runners that built and ran them, for the same
          # reason - attaching a rebuild would attach something nothing has started.
          assets=(
            package/Analyzers/UnityPerformanceAnalyzers.dll
            package/Analyzers/UnityPerformanceAnalyzers.CodeFixes.dll
            package/Analyzers/zh-Hant/UnityPerformanceAnalyzers.resources.dll
            "artifacts/nuget/NeshGames.UnityPerformanceAnalyzers.Cli.$VERSION.nupkg"
            "$RUNNER_TEMP/cli/upa-cli-$VERSION-linux-x64.tar.gz"
            "$RUNNER_TEMP/cli/upa-cli-$VERSION-osx-arm64.tar.gz"
            "$RUNNER_TEMP/cli/upa-cli-$VERSION-win-x64.zip"
          )

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes "$notes"
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" --title "$TAG" --notes "$notes" "${assets[@]}"
          fi
